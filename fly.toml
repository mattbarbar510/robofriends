# fly.toml app configuration for the robofriends calorie tracker MCP server
#
# Before first deploy:
#   1. Pick a unique app name and update `app` below (or run `fly launch` to set it).
#   2. fly volumes create robofriends_data --region <region> --size 1
#   3. fly secrets set MCP_AUTH_TOKEN=$(openssl rand -hex 32)
#   4. fly deploy

app = "robofriends-calories"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  ROBOFRIENDS_DB_PATH = "/data/calories.db"

[[mounts]]
  source = "robofriends_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
